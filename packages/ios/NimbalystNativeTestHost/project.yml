name: NimbalystNativeTestHost
options:
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "26.2"
settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_TESTABILITY: YES
    CODE_SIGNING_ALLOWED: NO
    GENERATE_INFOPLIST_FILE: YES
    TARGETED_DEVICE_FAMILY: "1,2"
packages:
  NimbalystNative:
    path: ../NimbalystNative
targets:
  NimbalystNativeTestHost:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.meistertech.nimbalyst.tests.host
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
  NimbalystNativeTests:
    type: bundle.unit-test
    platform: iOS
    sources: [../NimbalystNative/Tests]
    dependencies:
      - target: NimbalystNativeTestHost
      - package: NimbalystNative
        product: NimbalystNative
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.meistertech.nimbalyst.tests.native
schemes:
  NimbalystNativeHostedTests:
    build:
      targets:
        NimbalystNativeTestHost: all
    test:
      gatherCoverageData: true
      targets:
        - name: NimbalystNativeTests
          parallelizable: false
          randomExecutionOrder: false
